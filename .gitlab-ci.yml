stages:
  - prepare
  - test
  - report

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  # Переменные должны быть заданы в GitLab CI/CD Variables
  # BASE_URL, TANDOOR_USERNAME, TANDOOR_PASSWORD, TANDOOR_TOKEN

cache:
  paths:
    - .cache/pip
    - venv/

prepare:
  stage: prepare
  image: python:3.11-bullseye
  before_script:
    - apt-get update -qq --allow-releaseinfo-change
    - apt-get install -qq -y python3-venv
    - mkdir -p venv
    - python3 -m venv venv
    - source venv/bin/activate
    - pip install -r requirements.txt
  script:
    - echo "Environment prepared"
    - echo "BASE_URL is set"
  artifacts:
    paths:
      - venv/
    expire_in: 1 hour

# Тесты с мок-сервером (всегда запускаются и проходят)
test_ui_mock:
  stage: test
  image: python:3.11-bullseye
  dependencies:
    - prepare
  services:
    - name: selenium/standalone-chrome:latest
      alias: selenium
  variables:
    BASE_URL: "http://172.17.0.1:8000"
    TANDOOR_USERNAME: "admin"
    TANDOOR_PASSWORD: "admin"
    CI: "true"
  before_script:
    - source venv/bin/activate
    - pip install flask
  script:
    # Определяем IP контейнера
    - export CONTAINER_IP=$(hostname -I | awk '{print $1}')
    - echo "Container IP: $CONTAINER_IP"
    # Запускаем мок-сервер на всех интерфейсах
    - python mock_tandoor_server.py --host=0.0.0.0 --port=8000 &
    - sleep 5
    # Проверяем, что сервер доступен
    - curl -s http://$CONTAINER_IP:8000/ || curl -s http://localhost:8000/
    # Запускаем тесты с правильным IP
    - export BASE_URL="http://$CONTAINER_IP:8000"
    - pytest tests/test_ui_local_mock.py -v --alluredir=allure-ui-mock
    - pkill -f mock_tandoor_server || true
  artifacts:
    paths:
      - allure-ui-mock/
    expire_in: 1 hour

# Тесты API с мок-сервером (стабильные)
test_api:
  stage: test
  image: python:3.11-bullseye
  dependencies:
    - prepare
  variables:
    BASE_URL: "http://localhost:8000"
  before_script:
    - source venv/bin/activate
    - pip install flask
  script:
    - python mock_tandoor_server.py &
    - sleep 5
    - pytest tests/test_api_mock.py -v --alluredir=allure-api
    - pkill -f mock_tandoor_server || true
  artifacts:
    paths:
      - allure-api/
    expire_in: 1 hour

# UI тесты с реальным сервером
test_ui:
  stage: test
  image: python:3.11-bullseye
  dependencies:
    - prepare
  services:
    - name: selenium/standalone-chrome:latest
      alias: selenium
  before_script:
    - source venv/bin/activate
    - cp .env.ci .env  # Копируем credentials
  script:
    - pytest tests/test_ui_meal_plan.py -m ui --alluredir=allure-ui
  artifacts:
    paths:
      - allure-ui/
    expire_in: 1 hour

pages:
  stage: report
  image: python:3.11-bullseye
  dependencies:
    - test_ui_mock
  before_script:
    - apt-get update -qq && apt-get install -y -qq wget unzip openjdk-11-jdk
    - wget -q https://github.com/allure-framework/allure2/releases/download/2.24.0/allure-2.24.0.tgz
    - tar -xzf allure-2.24.0.tgz
    - export PATH=$PATH:$(pwd)/allure-2.24.0/bin
  script:
    - allure generate allure-ui-mock --clean -o public
  artifacts:
    paths:
      - public/
    expire_in: 1 week
  only:
    - main
