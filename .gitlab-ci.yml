stages:
  - prepare
  - test
  - report

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip
    - venv/

prepare:
  stage: prepare
  image: python:3.11-bullseye
  before_script:
    - apt-get update --allow-releaseinfo-change
    - apt-get install -y python3-venv
    - python3 -m venv venv
    - source venv/bin/activate
    - pip install -r requirements.txt
  script:
    - echo "Environment prepared"
  artifacts:
    paths:
      - venv/
    expire_in: 1 hour

test_api:
  stage: test
  image: python:3.11-bullseye
  dependencies:
    - prepare
  before_script:
    - source venv/bin/activate
  script:
    - pytest tests/test_api_client.py -m api --alluredir=allure-results
  artifacts:
    paths:
      - allure-results/
    expire_in: 1 hour

test_ui:
  stage: test
  image: python:3.11-bullseye
  dependencies:
    - prepare
  services:
    - name: selenium/standalone-chrome:latest
      alias: selenium
  before_script:
    - source venv/bin/activate
  script:
    - pytest tests/test_ui_meal_plan.py -m ui --alluredir=allure-results
  artifacts:
    paths:
      - allure-results/
    expire_in: 1 hour

generate_report:
  stage: report
  image: python:3.11-bullseye
  dependencies:
    - test_api
    - test_ui
  before_script:
    - pip install allure-pytest
  script:
    - allure generate allure-results --clean -o public
  artifacts:
    paths:
      - public/
    expire_in: 1 week
  only:
    - master
